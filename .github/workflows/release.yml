name: Release

on:
  push:
    tags:
      - "v*"
  # A change to the release path is proved here, up to the upload, before it can reach a tag.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-validation.yml"
      - "build-constraints.txt"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  # Generated surfaces, the dependency audit, the docs build, the SBOM, and provenance.
  validate:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-validation.yml

  # Kept apart from validate, which runs tools resolved at run time. Nothing unlocked may run where
  # the published files are made: build-constraints.txt pins the build backend by hash, and this job
  # installs nothing else. --no-sources proves the package builds the way PyPI will install it.
  # The repository publishes one distribution, mcp-ltspice-qucs: one sdist and one wheel.
  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      # PyPI never lets a version be reused, so catch mistakes here. This check and the version
      # check below are not a security boundary, because a tagged commit can edit this file. The
      # repository's tag ruleset and the pypi environment's tag policy restrict publishing.
      - name: Refuse a tag that is not on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build the package
        run: uv build --no-sources --python 3.12 --build-constraint build-constraints.txt --require-hashes

      - name: Expect exactly one sdist and one wheel
        run: |
          test "$(find dist -maxdepth 1 -name 'mcp_ltspice_qucs-*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'mcp_ltspice_qucs-*-py3-none-any.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Refuse a tag that does not match the package version
        if: github.ref_type == 'tag'
        run: |
          test -f "dist/mcp_ltspice_qucs-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          test -f "dist/mcp_ltspice_qucs-${GITHUB_REF_NAME#v}.tar.gz"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel and load every server
        run: |
          uv venv --python 3.12 wheel-env
          uv pip install --python wheel-env/bin/python dist/*.whl
          wheel-env/bin/python -c '
          import importlib
          from importlib.metadata import distribution
          for module in ("rf_mcp_common", "mcp_rf_analysis", "mcp_ltspice", "mcp_qucs_s"):
              importlib.import_module(module)
          commands = {
              e.name: e for e in distribution("mcp-ltspice-qucs").entry_points
              if e.group == "console_scripts"
          }
          assert set(commands) == {"mcp-ltspice", "mcp-qucs-s", "mcp-rf-analysis"}, sorted(commands)
          for name, command in sorted(commands.items()):
              server = importlib.import_module(command.module).mcp
              command.load()
              print(name, "loaded", server.name, server.version)
          '

  publish:
    if: github.ref_type == 'tag'
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/mcp-ltspice-qucs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      # Trusted publishing: PyPI project mcp-ltspice-qucs, workflow release.yml, environment pypi.
      - name: Publish mcp-ltspice-qucs
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in
            *a*|*b*|*rc*) flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $flags dist/*
