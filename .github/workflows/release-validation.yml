name: Release validation

# Runs as the first job of release.yml, which publishes only if this passes.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false

      - run: uv python install 3.13
      - run: uv sync --frozen

      - name: Verify release surfaces
        run: |
          uv run pytest -q tests/test_versions.py tests/test_documentation_contract.py tests/test_tool_contract_snapshot.py tests/test_client_configs.py
          uv run python scripts/gen_tool_catalog.py --check
          uv run python scripts/gen_backend_matrix.py --check
          uv run python scripts/gen_tool_contract_snapshot.py --check
          uv run mkdocs build --strict --site-dir _site

      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-hashes --output-file requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt

      - name: Build the release artifacts
        run: uv build

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          artifact-name: rf-mcp-suite.spdx.json
          output-file: dist/rf-mcp-suite.spdx.json
          format: spdx-json

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
