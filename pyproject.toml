[project]
name = "mcp-ltspice-qucs"
version = "0.6.2"
description = "RF engineering MCP servers for LTspice/ngspice, Qucs-S, and simulator-agnostic RF analysis, in one package"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Adam Engelbrecht", email = "adam.engelbrecht76@gmail.com" }]
keywords = [
    "mcp",
    "ltspice",
    "ngspice",
    "spice",
    "qucs",
    "qucs-s",
    "harmonic-balance",
    "microstrip",
    "filter-design",
    "scikit-rf",
    "coexistence",
    "rf-engineering",
]

# One distribution ships all four import packages (rf_mcp_common, mcp_rf_analysis,
# mcp_ltspice, mcp_qucs_s) and the three server commands below.
dependencies = [
    "anyio>=4.14.2,<4.15",
    "fastmcp>=3.4.10,<3.5",
    "pydantic>=2.7,<3",
    "scikit-rf>=1.2.0,<2",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<4",
    "spicelib>=1.4.0,<3",
    "matplotlib>=3.8,<4",
    "joblib>=1.3,<2",
    "schemdraw>=0.22,<1",
    "lxml>=5.0,<7",
]

[project.urls]
Homepage = "https://github.com/RFingAdam/mcp-ltspice-qucs"
Documentation = "https://rfingadam.github.io/mcp-ltspice-qucs/"
Repository = "https://github.com/RFingAdam/mcp-ltspice-qucs"
Changelog = "https://github.com/RFingAdam/mcp-ltspice-qucs/blob/main/CHANGELOG.md"
Issues = "https://github.com/RFingAdam/mcp-ltspice-qucs/issues"

[project.scripts]
mcp-ltspice = "mcp_ltspice.server:main"
mcp-qucs-s = "mcp_qucs_s.server:main"
mcp-rf-analysis = "mcp_rf_analysis.server:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

# The source stays in packages/<server>/src/<module>; the wheel puts each module at top level.
[tool.hatch.build.targets.wheel]
packages = [
    "packages/rf-mcp-common/src/rf_mcp_common",
    "packages/mcp-rf-analysis/src/mcp_rf_analysis",
    "packages/mcp-ltspice/src/mcp_ltspice",
    "packages/mcp-qucs-s/src/mcp_qucs_s",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "packages/rf-mcp-common/src",
    "packages/mcp-rf-analysis/src",
    "packages/mcp-ltspice/src",
    "packages/mcp-qucs-s/src",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.uv]
# numpy 2.5 stubs use Python 3.12 syntax, which mypy rejects at the 3.11 target set below.
constraint-dependencies = ["numpy<2.5"]

[dependency-groups]
dev = [
    "ruff>=0.6.9,<1",
    "mypy>=1.11.2,<2",
    "pytest>=8.3.3,<10",
    "pytest-cov>=5.0.0,<8",
    "hypothesis>=6.112.0,<7",
    "pre-commit>=3.8.0,<5",
    "mkdocs-material>=9.5.0,<10",
    "mkdocstrings[python]>=1.0.8,<2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "packages/rf-mcp-common/src",
    "packages/mcp-ltspice/src",
    "packages/mcp-rf-analysis/src",
    "packages/mcp-qucs-s/src",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "C4",       # comprehensions
    "PIE",      # pie
    "PT",       # pytest
    "RET",      # return
    "TID",      # tidy-imports
]
ignore = [
    "E501",     # line length (formatter handles)
    "B008",     # FastMCP uses Pydantic Field defaults in signatures
    "RUF001",   # ambiguous unicode chars (math symbols × σ – are intentional)
    "RUF002",
    "RUF003",
    "SIM108",   # ternaries aren't always more readable than if/else blocks
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["B011", "S101", "PT011", "PT018", "ARG001"]
"examples/**/*.py" = ["T201"]  # print() in scripts is fine

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
namespace_packages = true
explicit_package_bases = true
# Each package ships its own tests/conftest.py; without this mypy aborts with
# "Duplicate module named conftest" before checking a single source file.
exclude = ['packages/.*/tests/.*']
# mypy was effectively disabled until v0.4.1 (it aborted on the conftest clash
# above, and CI masked that with `|| true`). Turning it on surfaced ~190 errors.
# We enforce type *correctness* now. Anything that indicates a real defect,
# and defer type *completeness* (annotating every numpy return and generic
# parameter) to a ratchet (issue #37). Do not add codes here to silence a new
# error. no-untyped-def has been retired from this list. Every internal helper
# is now annotated.
disable_error_code = []
mypy_path = [
    "packages/rf-mcp-common/src",
    "packages/mcp-ltspice/src",
    "packages/mcp-rf-analysis/src",
    "packages/mcp-qucs-s/src",
]

[[tool.mypy.overrides]]
module = ["spicelib.*", "skrf.*", "scipy.*", "joblib.*", "schemdraw.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp_ltspice.schematic_render", "mcp_ltspice.report_pdf"]
disable_error_code = ["no-untyped-call"]  # schemdraw elements / matplotlib PdfPages.savefig are unannotated

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = [
    "tests",
    "packages/rf-mcp-common/tests",
    "packages/mcp-ltspice/tests",
    "packages/mcp-rf-analysis/tests",
    "packages/mcp-qucs-s/tests",
]
markers = [
    "integration: end-to-end tests that invoke a real simulator",
    "ltspice: requires LTspice via Wine",
    "ngspice: requires ngspice on PATH",
    "qucs: requires qucs-s on PATH",
    "xyce: requires Xyce on PATH",
    "slow: tests that take >5s",
]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
