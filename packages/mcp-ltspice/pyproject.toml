[project]
name = "mcp-ltspice"
version = "0.6.0"
description = "MCP server exposing LTspice (and ngspice fallback) for RF filter synthesis, S-parameter extraction, vendor model substitution, optimization, and Monte Carlo analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Adam Engelbrecht", email = "adam.engelbrecht76@gmail.com" }]
keywords = ["mcp", "ltspice", "ngspice", "spice", "filter-design", "rf-engineering"]

dependencies = [
    "rf-mcp-common>=0.6,<0.7",
    "mcp-rf-analysis>=0.6,<0.7",
    "fastmcp>=3.4.4,<3.5",
    "spicelib>=1.4.0,<3",
    "scipy>=1.11,<2",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "joblib>=1.3,<2",
    "schemdraw>=0.22,<1",
]

[project.scripts]
mcp-ltspice = "mcp_ltspice.server:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ltspice"]
