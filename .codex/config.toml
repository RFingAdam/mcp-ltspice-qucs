# Project-scoped Codex MCP configuration. Codex loads this file only after the
# repository is trusted. Relative cwd values resolve from this .codex folder.

[mcp_servers.ltspice]
required = true
command = "uv"
args = ["run", "--frozen", "--package", "mcp-ltspice", "mcp-ltspice"]
cwd = ".."
startup_timeout_sec = 60.0
tool_timeout_sec = 300.0

[mcp_servers.qucs_s]
required = true
command = "uv"
args = ["run", "--frozen", "--package", "mcp-qucs-s", "mcp-qucs-s"]
cwd = ".."
startup_timeout_sec = 60.0
tool_timeout_sec = 300.0

[mcp_servers.rf_analysis]
required = true
command = "uv"
args = ["run", "--frozen", "--package", "mcp-rf-analysis", "mcp-rf-analysis"]
cwd = ".."
startup_timeout_sec = 60.0
tool_timeout_sec = 300.0
